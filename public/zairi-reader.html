<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>財理リーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
/* Layout: 1列の学習ツール。上に読み込みと条件、中央に今読んでいる節、最下部に固定の再生バー。 */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #16202c;
  --muted: #5b6878;
  --line: #d7dde5;
  --accent: #1f4e8c;
  --accent-ink: #ffffff;
  --rank-a: #b3261e;
  --rank-b: #17695a;
  --rank-c: #5b6878;
  --hl: #dbe8fb;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-read: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141c; --surface: #16202b; --ink: #e7edf4; --muted: #93a1b3; --line: #27333f;
    --accent: #7db0f2; --accent-ink: #0e141c; --rank-a: #ff8a80; --rank-b: #5fd1b8; --rank-c: #8d99a9; --hl: #1f3550;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141c; --surface: #16202b; --ink: #e7edf4; --muted: #93a1b3; --line: #27333f;
  --accent: #7db0f2; --accent-ink: #0e141c; --rank-a: #ff8a80; --rank-b: #5fd1b8; --rank-c: #8d99a9; --hl: #1f3550;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.7;
  padding-inline: 16px; padding-block: 20px 200px;
}
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-read); font-size: 1.7rem; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.label { font-size: .78rem; color: var(--muted); letter-spacing: .08em; min-width: 4.5em; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.filebtn { display: inline-block; }
#pdf { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 12px; font-weight: 700; min-width: 3.2em; }
.chip[aria-pressed="true"][data-lv="A"] { background: var(--rank-a); border-color: var(--rank-a); color: var(--surface); }
.chip[aria-pressed="true"][data-lv="B"] { background: var(--rank-b); border-color: var(--rank-b); color: var(--surface); }
.chip[aria-pressed="true"][data-lv="C"] { background: var(--rank-c); border-color: var(--rank-c); color: var(--surface); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
#status { font-size: .88rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
progress { width: 100%; height: 6px; accent-color: var(--accent); }
progress[hidden] { display: none; }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; padding: 0 7px; border-radius: 4px; border: 1px solid currentColor; line-height: 1.6; letter-spacing: .04em; }
.badge.A { color: var(--rank-a); } .badge.B { color: var(--rank-b); } .badge.C { color: var(--rank-c); }
#reader .chapter { font-size: .8rem; color: var(--muted); margin: 0; }
#reader h2 { font-family: var(--font-read); font-size: 1.25rem; line-height: 1.5; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
#sents { font-family: var(--font-read); font-size: 1.05rem; line-height: 2; margin: 0; max-height: 46vh; overflow-y: auto; }
#sents span { border-radius: 3px; cursor: pointer; padding: 1px 0; }
#sents span.on { background: var(--hl); }
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.list-head h3 { margin: 0; font-size: 1rem; }
.chapter-title { font-size: .8rem; color: var(--muted); letter-spacing: .06em; margin: 10px 0 2px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 8px 2px; }
.item .t { overflow-wrap: anywhere; min-width: 0; }
.item .m { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item.on { background: var(--hl); }
#bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
}
#bar .inner { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
.ctl { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ctl button { border: 1px solid var(--line); background: transparent; border-radius: 50%; width: 46px; height: 46px; font-size: 1.5rem; line-height: 1; padding: 0; }
.ctl button.play { width: 58px; height: 58px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 1.2rem; }
.ctl .pos { font-size: .82rem; color: var(--muted); min-width: 5.5em; text-align: center; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: .85rem; }
.opts select { max-width: 11em; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.opts input[type=range] { width: 120px; accent-color: var(--accent); }
details.card > summary { cursor: pointer; font-weight: 700; }
.chrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 6px 0; }
.chrow .chk { min-width: 0; align-items: flex-start; overflow-wrap: anywhere; }
.mini { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: .78rem; white-space: nowrap; color: var(--accent); }
.note { font-size: .8rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>


<main class="wrap">
  <header>
    <h1>財理リーダー</h1>
    <p class="sub">財務会計論（理論）テキストのうち、重要度がA・Bの節だけを順番に読み上げます。</p>
  </header>

  <section class="card" id="loader" aria-label="PDFの読み込み">
    <div class="row">
      <label class="btn filebtn" for="pdf">テキストのPDFを選ぶ</label>
      <input id="pdf" type="file" accept="application/pdf">
      <button class="btn ghost" id="sampleBtn" type="button">サンプルに戻す</button>
    </div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <p id="status">サンプル表示中（テキスト1 第2章の一部）。PDFを選ぶと、そのテキスト全体から対象の節を取り出します。</p>
  </section>

  <section class="card" aria-label="読み上げ条件">
    <div class="row"><span class="label">基準</span>
      <div class="seg" role="group" aria-label="基準">
        <button type="button" id="modeRon" aria-pressed="true">論文</button>
        <button type="button" id="modeTan" aria-pressed="false">短答</button>
      </div>
    </div>
    <div class="row"><span class="label">重要度</span>
      <button type="button" class="chip" data-lv="A" aria-pressed="true">A</button>
      <button type="button" class="chip" data-lv="B" aria-pressed="true">B</button>
      <button type="button" class="chip" data-lv="C" aria-pressed="false">C</button>
    </div>
    <div class="row"><span class="label">読み方</span>
      <label class="chk" for="optHead"><input type="checkbox" id="optHead" checked>見出しも読む</label>
      <label class="chk" for="optFrag"><input type="checkbox" id="optFrag" checked>図表のかけらは飛ばす</label>
    </div>
  </section>

  <details class="card" id="chapBox">
    <summary id="chapSum">章を選ぶ</summary>
    <div class="row">
      <button type="button" class="mini" id="chAll">すべて選ぶ</button>
      <button type="button" class="mini" id="chNone">すべて外す</button>
    </div>
    <div id="chList"></div>
  </details>

  <section class="card" id="reader" aria-label="いま読んでいる節">
    <p class="chapter" id="rChap"></p>
    <h2 id="rHead">対象の節がありません</h2>
    <div class="row" id="rBadges"></div>
    <p id="sents"></p>
    <p class="note">本文はPDFのテキスト層から取り出した文字そのままです。文をタップすると、そこから読み始めます。</p>
  </section>

  <section aria-label="節の一覧">
    <div class="list-head"><h3>対象の節</h3><span class="note" id="listInfo"></span></div>
    <div id="list"></div>
  </section>
</main>

<div id="bar">
  <div class="inner">
    <div class="ctl">
      <button type="button" id="prev" aria-label="前の節">«</button>
      <button type="button" id="back" aria-label="前の文">‹</button>
      <button type="button" id="play" class="play" aria-label="再生">▶</button>
      <button type="button" id="fwd" aria-label="次の文">›</button>
      <button type="button" id="next" aria-label="次の節">»</button>
    </div>
    <div class="ctl"><span class="pos" id="pos">0 / 0</span></div>
    <div class="opts">
      <label for="rate">速さ <input type="range" id="rate" min="0.6" max="2" step="0.1" value="1"> <span id="rateV">1.0×</span></label>
      <label for="voice">声 <select id="voice"><option value="">自動（日本語）</option></select></label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
/* 財理リーダー: 抽出ロジック（PDFから取り出したテキスト → 節ごとの配列） */
(function (root) {
  var CJK = '\\u3000-\\u303f\\u3040-\\u30ff\\u3400-\\u9fff\\uff00-\\uffef';
  var MARK_SRC = '〔\\s*短答\\s*[：:]\\s*([ＡＢＣABC])\\s*論文\\s*[：:]\\s*([ＡＢＣABC])\\s*〕';
  var CHAP = /^\s*第\s*([０-９0-9]{1,2})\s*章\s+(\S.{0,40})$/;
  var CHAP_ANY = /^\s*第\s*[０-９0-9]{1,2}\s*[章節]\s*\S.{0,40}$/;
  var FOOT = /^[－\-‑—–]\s*\S{1,4}\s*[－\-‑—–]\s*[0-9０-９]+\s*[－\-‑—–]\s*$/;

  function toHalf(s) {
    return s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); });
  }
  function norm(c) { return { 'Ａ': 'A', 'Ｂ': 'B', 'Ｃ': 'C' }[c] || c; }

  /* 全文テキストを〔短答：X 論文：Y〕で区切って節の配列にする */
  function parseText(text) {
    text = String(text).replace(/\r/g, '');
    var lines = text.split('\n');
    var starts = [], pos = 0, i;
    for (i = 0; i < lines.length; i++) { starts.push(pos); pos += lines[i].length + 1; }

    function lineOf(idx) {
      var lo = 0, hi = starts.length - 1;
      while (lo < hi) {
        var mid = (lo + hi + 1) >> 1;
        if (starts[mid] <= idx) lo = mid; else hi = mid - 1;
      }
      return lo;
    }

    var chaps = [];
    for (i = 0; i < lines.length; i++) {
      var cm = lines[i].match(CHAP);
      if (cm && lines[i].indexOf('。') < 0) {
        chaps.push({ i: i, label: '第' + toHalf(cm[1]) + '章 ' + cm[2].replace(/\s+/g, ' ').trim() });
      }
    }
    function chapterAt(li) {
      var lab = '';
      for (var k = 0; k < chaps.length; k++) { if (chaps[k].i <= li) lab = chaps[k].label; else break; }
      return lab;
    }

    var re = new RegExp(MARK_SRC, 'g'), m, marks = [];
    while ((m = re.exec(text))) {
      marks.push({ idx: m.index, end: m.index + m[0].length, tan: norm(m[1]), ron: norm(m[2]) });
    }

    /* 見出しの行を決める（マーカーだけの行なら直前の行を見出しにする） */
    for (var k = 0; k < marks.length; k++) {
      var mk = marks[k];
      var li = lineOf(mk.idx);
      var before = text.slice(starts[li], mk.idx);
      var head = before.replace(/\s+/g, ' ').trim();
      var headLine = li;
      if (head.replace(/\s/g, '').length < 2) {
        var j = li - 1;
        while (j >= 0 && !lines[j].trim()) j--;
        if (j >= 0 && lines[j].search(new RegExp(MARK_SRC)) < 0 && (k === 0 || lineOf(marks[k - 1].end) < j)) {
          head = lines[j].replace(/\s+/g, ' ').trim();
          headLine = j;
        }
      }
      mk.head = head;
      mk.headLine = headLine;
      mk.chapter = chapterAt(headLine);
    }

    var segs = [];
    for (k = 0; k < marks.length; k++) {
      var bodyEnd = (k + 1 < marks.length) ? starts[marks[k + 1].headLine] : text.length;
      var bodyStart = marks[k].end;
      if (bodyEnd < bodyStart) bodyEnd = bodyStart;
      segs.push({
        ch: marks[k].chapter,
        h: marks[k].head,
        tan: marks[k].tan,
        ron: marks[k].ron,
        body: text.slice(bodyStart, bodyEnd)
      });
    }
    return segs;
  }

  function joinCjkSpaces(s) {
    /* 字間が空いた語（例: 開 示 後 発 事 象）は詰める */
    var lr = new RegExp('(^|\\s)((?:[' + CJK + ']\\s)+[' + CJK + '])(?=\\s|$)', 'g');
    s = s.replace(lr, function (m, pre, run) { return pre + run.replace(/\s+/g, ''); });
    /* 残った語どうしの空白は、読み上げで一拍置けるよう読点にする */
    var r = new RegExp('([' + CJK + '])\\s+([' + CJK + '])', 'g');
    var f = function (m, a, b) {
      if (/[，、。．）」』】〕：]/.test(a) || /[（「『【〔]/.test(b)) return a + b;
      return a + '、' + b;
    };
    s = s.replace(r, f);
    return s.replace(r, f);
  }

  function isProse(l) {
    var s = l.replace(/\s/g, '');
    if (!s) return false;
    var jp = (s.match(/[ぁ-んァ-ヶ一-龥ー，、。]/g) || []).length;
    if (jp / s.length < 0.6) return false;
    if (s.indexOf('。') >= 0) return true;
    return s.length >= 14;
  }

  /* 節の本文を読み上げ用の文の配列にする */
  function prepare(body, opts) {
    opts = opts || {};
    var out = [], raw = String(body).split('\n');
    for (var i = 0; i < raw.length; i++) {
      var l = raw[i].replace(/\s+/g, ' ').trim();
      if (!l) continue;
      if (FOOT.test(l)) continue;
      if (CHAP_ANY.test(l) && l.indexOf('。') < 0) continue;
      if (/^[（(]?[０-９0-9①-⑳]+[）).．.]/.test(l) && l.indexOf('。') < 0) continue;
      if (opts.dropFragments !== false && !isProse(l)) continue;
      out.push(joinCjkSpaces(l));
    }
    var s = '';
    for (i = 0; i < out.length; i++) {
      var prev = s.slice(-1), next = out[i].charAt(0);
      if (s && /[A-Za-z0-9]/.test(prev) && /[A-Za-z0-9]/.test(next)) s += ' ';
      s += out[i];
    }
    s = s.replace(/\bex\s*[)）]\s*/gi, '例：').replace(/[→⇒➡]/g, '、').replace(/[※＊*]/g, '');
    var sents = s.match(/[^。]+。?/g) || [];
    var res = [];
    for (i = 0; i < sents.length; i++) {
      var t = sents[i].trim();
      if (!t) continue;
      while (t.length > 110) {
        var cut = t.lastIndexOf('，', 110);
        if (cut < 30) cut = t.lastIndexOf('、', 110);
        if (cut < 30) cut = 110; else cut += 1;
        res.push(t.slice(0, cut));
        t = t.slice(cut);
      }
      if (t) res.push(t);
    }
    return res;
  }

  function headSpeech(seg) {
    var h = seg.h.replace(/^[（(]?[０-９0-9①-⑳]+[）).．.]?\s*/, '');
    h = joinCjkSpaces(h);
    var ch = seg.ch ? seg.ch.replace(/^第(\d+)章\s*/, '第$1章、') + '。' : '';
    return ch + h + '。';
  }

  var api = { parseText: parseText, prepare: prepare, headSpeech: headSpeech, toHalf: toHalf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ZR = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var synth = window.speechSynthesis;

  var SAMPLE = [
    '第２章 一般原則', '',
    '（１） 資本取引と損益取引の相違 〔短答：Ｂ 論文：Ｂ〕', '',
    '資本取引とは，純資産を直接的に増減させる取引で，企業活動の成果とは無関係の取引をいう。一方，損益取引とは，企業活動の成果と関連する取引をいう。', '',
    '両者とも結果的に，企業の純資産を増減させる取引であるが，以下の図にてその違いを説明する。', '',
    '－ ②－6 －', '',
    '（１） 継続性の原則の意味内容 〔短答：Ｂ 論文：Ｃ〕', '',
    '継続性の原則とは，いったん採用した会計方針は，正当な理由により変更を行う場合を除き，財務諸表を作成する各時期を通じて継続して適用しなければならないとする原則である。', '',
    '修正後発事象と開示後発事象 〔短答：Ａ 論文：Ａ〕',
    '修正後発事象 決算日現在において既に存在していた状況証拠が，決算日から当該年度の財務諸表を作成する日までの間において確実になった場合をいい，当年度の財務諸表を修正する必要がある後発事象をいう。',
    '開示後発事象 決算日後において全く新しい事象が発生した場合をいい，当年度の財務諸表に注記する必要がある後発事象をいう。'
  ].join('\n');

  var S = {
    all: [], view: [], cur: 0, pos: 0, items: [], playing: false, token: 0,
    mode: 'ron', lv: { A: true, B: true, C: false }, head: true, frag: true,
    rate: 1, voiceURI: '', docKey: 'sample', wake: null, chOff: {}
  };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 容量超過などは無視 */ } }

  /* ---------- 設定の復元 ---------- */
  (function restore() {
    try {
      var p = JSON.parse(lsGet('zr:prefs') || '{}');
      if (p.mode) S.mode = p.mode;
      if (p.lv) S.lv = p.lv;
      if (typeof p.head === 'boolean') S.head = p.head;
      if (typeof p.frag === 'boolean') S.frag = p.frag;
      if (p.rate) S.rate = p.rate;
      if (p.voiceURI) S.voiceURI = p.voiceURI;
    } catch (e) { /* 既定値のまま */ }
  })();
  function savePrefs() {
    lsSet('zr:prefs', JSON.stringify({ mode: S.mode, lv: S.lv, head: S.head, frag: S.frag, rate: S.rate, voiceURI: S.voiceURI }));
  }

  /* ---------- 絞り込み ---------- */
  function rankOf(seg) { return S.mode === 'ron' ? seg.ron : seg.tan; }
  function rebuildView(keepId) {
    var prevId = keepId;
    S.view = [];
    for (var i = 0; i < S.all.length; i++) {
      var seg = S.all[i];
      if (!S.lv[rankOf(seg)]) continue;
      if (S.chOff[seg.ch || '']) continue;
      var sents = ZR.prepare(seg.body, { dropFragments: S.frag });
      if (!sents.length) continue;
      S.view.push({ id: i, ch: seg.ch, h: seg.h, tan: seg.tan, ron: seg.ron, sents: sents, chars: sents.join('').length });
    }
    S.cur = 0; S.pos = 0;
    if (prevId != null) {
      for (var j = 0; j < S.view.length; j++) { if (S.view[j].id >= prevId) { S.cur = j; break; } }
    }
  }

  /* ---------- 画面の描画 ---------- */
  function minutes(chars) { return Math.max(1, Math.round(chars / (330 * S.rate))); }
  function renderList() {
    var box = $('list'); box.textContent = '';
    var total = 0, lastCh = null;
    S.view.forEach(function (v, idx) {
      total += v.chars;
      if (v.ch !== lastCh) {
        var ct = document.createElement('div'); ct.className = 'chapter-title'; ct.textContent = v.ch || '（章の見出しなし）';
        box.appendChild(ct); lastCh = v.ch;
      }
      var b = document.createElement('button'); b.type = 'button'; b.className = 'item' + (idx === S.cur ? ' on' : ''); b.dataset.i = idx;
      var bd = document.createElement('span'); bd.className = 'badge ' + rankOf(v); bd.textContent = rankOf(v);
      var t = document.createElement('span'); t.className = 't'; t.textContent = v.h;
      var m = document.createElement('span'); m.className = 'm'; m.textContent = v.chars + '字';
      b.append(bd, t, m); box.appendChild(b);
    });
    $('listInfo').textContent = S.view.length + '節 / 約' + minutes(total) + '分（' + S.rate.toFixed(1) + '倍速）';
  }
  function renderCurrent() {
    var v = S.view[S.cur];
    $('pos').textContent = (S.view.length ? S.cur + 1 : 0) + ' / ' + S.view.length;
    var sents = $('sents'); sents.textContent = '';
    $('rBadges').textContent = '';
    if (!v) {
      $('rChap').textContent = ''; $('rHead').textContent = '対象の節がありません';
      return;
    }
    $('rChap').textContent = v.ch;
    $('rHead').textContent = v.h.replace(/^[（(]?[０-９0-9①-⑳]+[）).．.]?\s*/, '') || v.h;
    [['論文', v.ron], ['短答', v.tan]].forEach(function (x) {
      var s = document.createElement('span'); s.className = 'badge ' + x[1]; s.textContent = x[0] + x[1];
      $('rBadges').appendChild(s);
    });
    v.sents.forEach(function (t, i) {
      var s = document.createElement('span'); s.dataset.i = i; s.textContent = t;
      sents.appendChild(s);
    });
    highlight();
    document.querySelectorAll('#list .item').forEach(function (el) { el.classList.toggle('on', Number(el.dataset.i) === S.cur); });
    var on = document.querySelector('#list .item.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }
  function highlight() {
    var off = S.head ? 1 : 0, idx = S.pos - off;
    document.querySelectorAll('#sents span').forEach(function (el) {
      var on = Number(el.dataset.i) === idx;
      el.classList.toggle('on', on);
      if (on && S.playing && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    });
  }
  function chapterList() {
    var m = {}, o = [];
    S.all.forEach(function (s) {
      var k = s.ch || '';
      if (!m[k]) { m[k] = { k: k, n: 0 }; o.push(m[k]); }
      if (S.lv[rankOf(s)]) m[k].n++;
    });
    return o;
  }
  function renderChapters() {
    var box = $('chList'); box.textContent = '';
    var cs = chapterList(), on = 0;
    cs.forEach(function (c, i) {
      var off = !!S.chOff[c.k]; if (!off) on++;
      var row = document.createElement('div'); row.className = 'chrow';
      var lab = document.createElement('label'); lab.className = 'chk'; lab.htmlFor = 'ch' + i;
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'ch' + i; cb.checked = !off; cb.dataset.k = c.k;
      var tx = document.createElement('span'); tx.textContent = (c.k || '（章の見出しなし）') + '（' + c.n + '節）';
      lab.append(cb, tx);
      var only = document.createElement('button'); only.type = 'button'; only.className = 'mini'; only.dataset.k = c.k; only.textContent = 'この章だけ';
      row.append(lab, only); box.appendChild(row);
    });
    $('chapSum').textContent = '章を選ぶ（' + on + ' / ' + cs.length + '章）';
  }
  function saveCh() { lsSet('zr:ch:' + S.docKey, JSON.stringify(S.chOff)); }
  function renderAll() { renderChapters(); renderList(); renderCurrent(); savePos(); }

  function setPlayIcon() {
    var b = $('play'); b.textContent = S.playing ? '❚❚' : '▶'; b.setAttribute('aria-label', S.playing ? '一時停止' : '再生');
  }

  /* ---------- 読み上げ ---------- */
  function buildItems(v) {
    var items = [];
    if (S.head) items.push(ZR.headSpeech(v));
    return items.concat(v.sents);
  }
  function pickVoice() {
    if (!synth) return null;
    var vs = synth.getVoices().filter(function (x) { return /^ja/i.test(x.lang); });
    if (S.voiceURI) { for (var i = 0; i < vs.length; i++) if (vs[i].voiceURI === S.voiceURI) return vs[i]; }
    return vs[0] || null;
  }
  function say(t) {
    if (t !== S.token) return;
    if (S.pos >= S.items.length) {
      if (S.cur < S.view.length - 1) { S.cur++; S.pos = 0; renderAll(); startAt(0); }
      else { stop(); }
      return;
    }
    var u = new SpeechSynthesisUtterance(S.items[S.pos]);
    u.lang = 'ja-JP'; u.rate = S.rate;
    var vo = pickVoice(); if (vo) u.voice = vo;
    u.onend = function () { if (t !== S.token) return; S.pos++; highlight(); say(t); };
    u.onerror = function (e) {
      if (t !== S.token) return;
      if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
      S.pos++; say(t);
    };
    highlight();
    synth.speak(u);
  }
  function startAt(p) {
    if (!synth) { $('status').textContent = 'このブラウザは音声読み上げに対応していません。'; return; }
    var v = S.view[S.cur]; if (!v) return;
    S.token++; synth.cancel();
    S.items = buildItems(v);
    S.pos = Math.max(0, Math.min(p, S.items.length - 1));
    S.playing = true; setPlayIcon();
    wake(true);
    say(S.token);
  }
  function stop() {
    S.token++; if (synth) synth.cancel();
    S.playing = false; setPlayIcon(); wake(false); savePos();
  }
  function wake(on) {
    try {
      if (on && navigator.wakeLock && !S.wake) {
        navigator.wakeLock.request('screen').then(function (l) { S.wake = l; l.addEventListener('release', function () { S.wake = null; }); }, function () {});
      } else if (!on && S.wake) { S.wake.release(); S.wake = null; }
    } catch (e) { /* 対応していなければそのまま */ }
  }
  function goSeg(i) {
    if (!S.view.length) return;
    var was = S.playing;
    S.cur = Math.max(0, Math.min(i, S.view.length - 1)); S.pos = 0;
    if (was) { S.token++; if (synth) synth.cancel(); }
    renderAll();
    if (was) startAt(0);
  }
  function savePos() {
    var v = S.view[S.cur];
    if (v) lsSet('zr:pos:' + S.docKey, JSON.stringify({ id: v.id, mode: S.mode }));
  }

  /* ---------- PDFの読み込み ---------- */
  function setStatus(t) { $('status').textContent = t; }
  async function extractPdf(file) {
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var out = [];
    $('prog').hidden = false;
    for (var p = 1; p <= pdf.numPages; p++) {
      var page = await pdf.getPage(p);
      var tc = await page.getTextContent();
      var lines = [], cur = '', lastY = null;
      for (var k = 0; k < tc.items.length; k++) {
        var it = tc.items[k];
        if (typeof it.str !== 'string') continue;
        var y = it.transform[5];
        if (lastY !== null && Math.abs(y - lastY) > 3) { lines.push(cur); cur = ''; }
        cur += it.str; lastY = y;
        if (it.hasEOL) { lines.push(cur); cur = ''; lastY = null; }
      }
      if (cur) lines.push(cur);
      out.push(lines.join('\n'));
      page.cleanup();
      $('prog').value = p / pdf.numPages;
      setStatus('文字を取り出し中… ' + p + ' / ' + pdf.numPages + ' ページ');
      if (p % 4 === 0) await new Promise(function (r) { setTimeout(r, 0); });
    }
    $('prog').hidden = true;
    return out.join('\n');
  }
  function summary(all) {
    var c = { A: 0, B: 0, C: 0 }, t = { A: 0, B: 0, C: 0 };
    all.forEach(function (s) { c[s.ron]++; t[s.tan]++; });
    return '節を ' + all.length + ' 件検出。論文 A' + c.A + ' / B' + c.B + ' / C' + c.C + '、短答 A' + t.A + ' / B' + t.B + ' / C' + t.C + '。';
  }
  function applyDoc(all, key, msg) {
    stop();
    S.all = all; S.docKey = key;
    try { S.chOff = JSON.parse(lsGet('zr:ch:' + key) || '{}') || {}; } catch (e) { S.chOff = {}; }
    var saved = null; try { saved = JSON.parse(lsGet('zr:pos:' + key) || 'null'); } catch (e) { saved = null; }
    rebuildView(saved && saved.mode === S.mode ? saved.id : null);
    renderAll();
    setStatus(msg);
  }
  async function onFile(file) {
    if (!file) return;
    var key = file.name + ':' + file.size;
    var cached = lsGet('zr:doc:' + key);
    if (cached) {
      try { var c = JSON.parse(cached); applyDoc(c, key, file.name + '：前回の解析結果を使いました。' + summary(c)); return; } catch (e) { /* 解析し直す */ }
    }
    try {
      setStatus('PDFを開いています…');
      if (typeof pdfjsLib === 'undefined') throw new Error('PDF読み込みライブラリを取得できませんでした。通信を確認してください。');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      var text = await extractPdf(file);
      var all = ZR.parseText(text);
      if (!all.length) {
        setStatus(file.name + '：〔短答：Ａ 論文：Ｂ〕の形の印が見つかりませんでした。重要度つきの本文テキストのPDFか確認してください。');
        return;
      }
      var slim = all.filter(function (s) { return s.ron !== 'C' || s.tan !== 'C'; });
      lsSet('zr:doc:' + key, JSON.stringify(slim));
      applyDoc(all, key, file.name + '：' + summary(all));
    } catch (e) {
      $('prog').hidden = true;
      setStatus('読み込みに失敗しました：' + (e && e.message ? e.message : e));
    }
  }

  /* ---------- イベント ---------- */
  function refilter() {
    var id = S.view[S.cur] ? S.view[S.cur].id : null;
    var was = S.playing; if (was) stop();
    rebuildView(id); renderAll(); savePrefsUi();
  }
  function savePrefsUi() { savePrefs(); }
  function syncControls() {
    $('modeRon').setAttribute('aria-pressed', S.mode === 'ron');
    $('modeTan').setAttribute('aria-pressed', S.mode === 'tan');
    document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', !!S.lv[c.dataset.lv]); });
    $('optHead').checked = S.head; $('optFrag').checked = S.frag;
    $('rate').value = S.rate; $('rateV').textContent = S.rate.toFixed(1) + '×';
  }
  $('pdf').addEventListener('change', function (e) { onFile(e.target.files[0]); });
  $('sampleBtn').addEventListener('click', function () {
    applyDoc(ZR.parseText(SAMPLE), 'sample', 'サンプル表示中（テキスト1 第2章の一部）。');
  });
  $('modeRon').addEventListener('click', function () { S.mode = 'ron'; syncControls(); refilter(); });
  $('modeTan').addEventListener('click', function () { S.mode = 'tan'; syncControls(); refilter(); });
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { S.lv[c.dataset.lv] = !S.lv[c.dataset.lv]; syncControls(); refilter(); });
  });
  $('optHead').addEventListener('change', function (e) { S.head = e.target.checked; refilter(); });
  $('optFrag').addEventListener('change', function (e) { S.frag = e.target.checked; refilter(); });
  $('rate').addEventListener('input', function (e) {
    S.rate = Number(e.target.value); $('rateV').textContent = S.rate.toFixed(1) + '×'; savePrefs();
    $('listInfo').textContent = $('listInfo').textContent.replace(/約\d+分（[\d.]+倍速）/, function () {
      var total = S.view.reduce(function (a, v) { return a + v.chars; }, 0);
      return '約' + minutes(total) + '分（' + S.rate.toFixed(1) + '倍速）';
    });
  });
  $('rate').addEventListener('change', function () { if (S.playing) startAt(S.pos); });
  $('voice').addEventListener('change', function (e) { S.voiceURI = e.target.value; savePrefs(); if (S.playing) startAt(S.pos); });
  $('play').addEventListener('click', function () {
    if (!S.view.length) return;
    if (S.playing) stop(); else startAt(S.pos);
  });
  $('prev').addEventListener('click', function () { goSeg(S.cur - 1); });
  $('next').addEventListener('click', function () { goSeg(S.cur + 1); });
  $('back').addEventListener('click', function () { if (S.playing) startAt(Math.max(0, S.pos - 1)); else { S.pos = Math.max(0, S.pos - 1); highlight(); } });
  $('fwd').addEventListener('click', function () { if (S.playing) startAt(S.pos + 1); else { S.pos = Math.min(buildItems(S.view[S.cur] || { sents: [] }).length - 1, S.pos + 1); highlight(); } });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.item'); if (!b) return;
    var was = S.playing; goSeg(Number(b.dataset.i)); if (!was) { S.pos = 0; }
  });
  $('sents').addEventListener('click', function (e) {
    var s = e.target.closest('span'); if (!s) return;
    startAt(Number(s.dataset.i) + (S.head ? 1 : 0));
  });

  $('chList').addEventListener('change', function (e) {
    var cb = e.target; if (!cb || cb.type !== 'checkbox') return;
    S.chOff[cb.dataset.k] = !cb.checked; saveCh(); refilter();
  });
  $('chList').addEventListener('click', function (e) {
    var b = e.target.closest('.mini'); if (!b) return;
    S.chOff = {};
    chapterList().forEach(function (c) { if (c.k !== b.dataset.k) S.chOff[c.k] = true; });
    saveCh(); refilter();
  });
  $('chAll').addEventListener('click', function () { S.chOff = {}; saveCh(); refilter(); });
  $('chNone').addEventListener('click', function () {
    S.chOff = {}; chapterList().forEach(function (c) { S.chOff[c.k] = true; }); saveCh(); refilter();
  });

  /* 声の一覧 */
  function loadVoices() {
    if (!synth) return;
    var vs = synth.getVoices().filter(function (x) { return /^ja/i.test(x.lang); });
    var sel = $('voice'); sel.textContent = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = '自動（日本語）'; sel.appendChild(o);
    vs.forEach(function (x) { var op = document.createElement('option'); op.value = x.voiceURI; op.textContent = x.name; sel.appendChild(op); });
    sel.value = S.voiceURI;
    if (sel.value !== S.voiceURI) sel.value = '';
    if (!vs.length) setStatus($('status').textContent + '（日本語の音声が見つかりません。端末の設定で日本語の声を追加してください。）');
  }
  if (synth) { synth.onvoiceschanged = loadVoices; loadVoices(); }
  else { setStatus('このブラウザは音声読み上げに対応していません。'); }

  /* 起動 */
  syncControls();
  applyDoc(ZR.parseText(SAMPLE), 'sample', $('status').textContent);
  setPlayIcon();
})();
</script>

</body>
</html>
